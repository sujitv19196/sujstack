# Generated by `bun run metrics:rules`. Do not edit.
groups:
  - name: "sujstack"
    rules:
      - alert: "TrpcServerErrorRatio"
        expr: "sum(rate(trpc_requests_total{outcome=\"server_error\"}[5m])) / sum(rate(trpc_requests_total[5m])) > 0.05"
        for: "10m"
        labels:
          severity: "page"
        annotations:
          summary: "More than 5% of tRPC calls are failing with a server error"
